{% extends "base.html" %}
{% block title %}Moderation — {{ congress_short }}{% endblock %}

{% block head %}
<style>
.md-page{min-height:100vh;padding-bottom:60px;background:radial-gradient(ellipse at 0% 0%,rgba(10,61,46,.3),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(201,169,98,.03),transparent 50%),var(--bg)}
.md-title{display:flex;align-items:center;gap:14px;padding:24px 0 8px;flex-wrap:wrap}
.md-title h2{font:600 1.4rem var(--fh);color:var(--w)}.md-title h2 span{color:var(--gold)}
.md-stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.md-stat{background:rgba(10,61,46,.35);border:1px solid rgba(201,169,98,.12);border-radius:var(--r);padding:12px 18px;min-width:96px}
.md-stat .v{font:700 1.4rem var(--fh);color:var(--w)}
.md-stat .l{font:.66rem var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--w5);margin-top:2px}
.md-card{background:var(--glass);border:1px solid rgba(201,169,98,.12);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px}
.md-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.md-tag{font:600 .6rem var(--f);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:50px;background:var(--ga2);color:var(--gold);border:1px solid var(--ga2)}
.md-count{font:600 .62rem var(--f);padding:3px 9px;border-radius:50px;background:rgba(231,76,60,.12);color:var(--red);border:1px solid rgba(231,76,60,.25)}
.md-body{font:.92rem/1.55 var(--f);color:var(--w9);background:rgba(0,0,0,.18);border-left:3px solid var(--gold);border-radius:6px;padding:10px 14px;white-space:pre-wrap;margin:6px 0}
.md-meta{font:.76rem var(--f);color:var(--w5);display:flex;gap:10px;flex-wrap:wrap}
.md-reasons{font:.8rem var(--f);color:var(--w7);margin:8px 0}
.md-reasons li{margin:2px 0}
.md-btn{padding:8px 16px;border:1px solid rgba(201,169,98,.15);border-radius:50px;background:rgba(10,61,46,.3);color:var(--w7);font:500 .82rem var(--f);cursor:pointer}
.md-btn:hover{border-color:var(--gold);color:var(--gold)}
.md-btn.danger{color:var(--red);border-color:rgba(231,76,60,.3)}
.md-btn.danger:hover{background:rgba(231,76,60,.12)}
.md-empty{text-align:center;padding:48px 24px;color:var(--w5);background:var(--glass);border:1px dashed rgba(201,169,98,.15);border-radius:var(--rl)}
</style>
{% endblock %}

{% block body %}
<div class="md-page">
{% include "nav.html" %}
<div class="container">
  <div class="md-title animate-up"><a href="/home" style="color:var(--w5);text-decoration:none;font-size:1.1rem;">&#8592;</a><h2>Content <span>Moderation</span></h2></div>
  <div class="md-stats" id="mdStats"></div>
  <div class="md-title" style="padding:8px 0"><h2 style="font-size:1rem">Report queue</h2><button class="md-btn" onclick="loadQueue()" style="margin-left:auto">Refresh</button></div>
  <div id="mdQueue"><div class="md-empty">Loading…</div></div>
</div></div>
{% endblock %}

{% block scripts %}
<script>
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
async function api(url,method='GET',body=null){const o={method,headers:{'Content-Type':'application/json'},credentials:'same-origin'};if(body)o.body=JSON.stringify(body);const r=await fetch(url,o);let d={};try{d=await r.json();}catch(e){}if(!r.ok){let m=d.detail||'Failed';if(Array.isArray(m))m=m.map(e=>e.msg).join('. ');throw new Error(m);}return d;}
const TYPE_LABEL={question:'Q&A question',poster_comment:'Poster comment'};

async function loadStats(){
  try{const s=await api('/api/moderation/stats');
    document.getElementById('mdStats').innerHTML=
      '<div class="md-stat"><div class="v" style="color:var(--red)">'+s.open+'</div><div class="l">Open</div></div>'+
      '<div class="md-stat"><div class="v">'+s.resolved+'</div><div class="l">Removed</div></div>'+
      '<div class="md-stat"><div class="v">'+s.dismissed+'</div><div class="l">Dismissed</div></div>';
  }catch(e){}
}
async function loadQueue(){
  loadStats();
  try{const d=await api('/api/moderation/reports');const c=document.getElementById('mdQueue');
    if(!d.reports.length){c.innerHTML='<div class="md-empty">🎉 Nothing in the queue — all clear.</div>';return;}
    c.innerHTML=d.reports.map(card).join('');
  }catch(e){showToast(e.message,'error');}
}
function card(r){
  const reasons=r.reasons.length?'<ul class="md-reasons">'+r.reasons.map(x=>'<li>“'+esc(x)+'”</li>').join('')+'</ul>':'<div class="md-reasons" style="color:var(--w3)">No reason given.</div>';
  return '<div class="md-card"><div class="md-head"><span class="md-tag">'+esc(TYPE_LABEL[r.content_type]||r.content_type)+'</span>'+
    '<span class="md-count">'+r.report_count+' report'+(r.report_count===1?'':'s')+'</span>'+
    '<span class="md-meta" style="margin-left:auto">'+esc(r.content_context||'')+'</span></div>'+
    '<div class="md-body">'+esc(r.content_preview||'(empty)')+'</div>'+
    '<div class="md-meta">by '+esc(r.content_author||'—')+' · first reported '+new Date(r.first_reported_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</div>'+
    reasons+
    '<div style="display:flex;gap:8px;margin-top:10px"><button class="md-btn danger" onclick="resolve('+r.id+',\'remove\')">Remove content</button>'+
    '<button class="md-btn" onclick="resolve('+r.id+',\'dismiss\')">Dismiss reports</button></div></div>';
}
async function resolve(id,action){
  if(action==='remove'&&!await confirmDialog({title:'Remove content',message:'Permanently remove this content? All reports on it are closed.',confirmText:'Remove',danger:true}))return;
  try{const r=await api('/api/moderation/reports/'+id+'/resolve','POST',{action});
    showToast(action==='remove'?'Content removed':'Reports dismissed','success');loadQueue();
    if(typeof refreshModBadge==='function')refreshModBadge();}
  catch(e){showToast(e.message,'error');}
}
document.addEventListener('DOMContentLoaded',loadQueue);
</script>
{% endblock %}
