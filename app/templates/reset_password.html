{% extends "base.html" %}
{% block title %}Set a new password — {{ congress_full }}{% endblock %}
{% block head %}<style>
.auth-page{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,rgba(10,61,46,.4),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg))}
.auth-body{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.auth-card{width:100%;max-width:440px}.auth-card .card{padding:48px 40px}
.auth-header{text-align:center;margin-bottom:28px}
.auth-header h2{font:600 1.5rem var(--fh);color:var(--w);margin-bottom:6px}
.auth-header p{font:.9rem/1.5 var(--f);color:var(--w5)}
.auth-form{display:flex;flex-direction:column;gap:16px}
.auth-footer{text-align:center;margin-top:24px;font:.88rem var(--f);color:var(--w5)}
.auth-footer a{font-weight:600;color:var(--gold)}
@media(max-width:540px){.auth-card .card{padding:32px 24px}}
</style>{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="nav-bar"><div class="container"><nav class="topnav animate-in"><a href="/" class="topnav-brand"><div class="topnav-logo"><img src="/static/favicon.png" alt="Logo"></div><span class="topnav-name">Dubai Stem Cell Congress</span></a></nav></div></div>
  <div class="auth-body"><div class="auth-card animate-scale"><div class="card">
    <div class="auth-header"><h2>Set a new password</h2><p>Choose a new password for your account.</p></div>
    <form class="auth-form" onsubmit="handleReset(event)">
      <input type="hidden" id="token" value="{{ token }}">
      <div class="form-group"><label class="form-label" for="newPw">New password</label><input type="password" class="form-input" id="newPw" placeholder="Min 8 chars, uppercase + number" required></div>
      <div class="form-group"><label class="form-label" for="confPw">Confirm password</label><input type="password" class="form-input" id="confPw" placeholder="Re-enter password" required></div>
      <button type="submit" class="btn btn-gold w-full" id="submitBtn">Reset password</button>
    </form>
    <div class="auth-footer"><a href="/login">← Back to sign in</a></div>
  </div></div></div>
</div>
{% endblock %}
{% block scripts %}<script>
async function handleReset(e){e.preventDefault();
  const token=document.getElementById('token').value;
  if(!token){showToast('This reset link is missing its token.','error');return;}
  if(document.getElementById('newPw').value!==document.getElementById('confPw').value){showToast('Passwords do not match','error');return;}
  const btn=document.getElementById('submitBtn');btn.innerHTML='<span class="spinner"></span> Resetting…';btn.disabled=true;
  try{const r=await fetch('/api/auth/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,new_password:document.getElementById('newPw').value})});
    const d=await r.json();if(!r.ok){let m=d.detail||'Failed';if(Array.isArray(m))m=m.map(x=>x.msg).join('. ');throw new Error(m);}
    showToast('Password reset — you can sign in now.','success');setTimeout(()=>window.location.href='/login',900);}
  catch(err){showToast(err.message,'error');btn.innerHTML='Reset password';btn.disabled=false;}}
</script>{% endblock %}
