{% extends "base.html" %}
{% block title %}Settings — {{ congress_short }}{% endblock %}
{% block head %}<style>
.page-wrap { min-height: 100vh; }
.home-header { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 0; }
.page-title-bar { display: flex; align-items: center; gap: 14px; margin: 28px 0 24px; }
.page-title-bar .back-link { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--gold-20); display: flex; align-items: center; justify-content: center; color: var(--gold); text-decoration: none; font-size: 1rem; background: var(--gold-10); transition: 0.2s; }
.page-title-bar .back-link:hover { background: var(--gold-15); color: var(--gold-light); }
.page-title-bar h2 span { color: var(--green); }
.settings-card { background: var(--surface); border: 1px solid var(--border-mid); border-radius: var(--r-xl); padding: 32px 34px; margin-bottom: 20px; max-width: 580px; position: relative; overflow: hidden; }
.settings-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--green-dark), var(--gold), var(--green-dark)); }
.settings-card h3 { font-size: 1.02rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
</style>{% endblock %}
{% block body %}
<div class="page-wrap">{% include "nav.html" %}<div class="container">
  <div class="page-title-bar animate-up"><a href="/home" class="back-link">←</a><h2><span>Settings</span></h2></div>
  <div class="settings-card animate-up delay-1">
    <h3>🔒 Change Password</h3>
    <form onsubmit="handlePwChange(event)" style="display:flex;flex-direction:column;gap:14px;">
      <div class="form-group"><label class="form-label">Current Password</label><input type="password" class="form-input" id="curPw" required></div>
      <div class="form-group"><label class="form-label">New Password</label><input type="password" class="form-input" id="newPw" required></div>
      <div class="form-group"><label class="form-label">Confirm</label><input type="password" class="form-input" id="confPw" required></div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;"><button type="submit" class="btn btn-primary btn-sm" id="pwBtn">Update Password</button></div>
    </form>
  </div>
</div></div>
{% endblock %}
{% block scripts %}<script>
async function handlePwChange(e){e.preventDefault();if(document.getElementById('newPw').value!==document.getElementById('confPw').value){showToast('Passwords do not match','error');return}const btn=document.getElementById('pwBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';try{const res=await fetch('/api/auth/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:document.getElementById('curPw').value,new_password:document.getElementById('newPw').value}),credentials:'same-origin'});const d=await res.json();if(!res.ok)throw new Error(d.detail);showToast('Password updated!','success');e.target.reset()}catch(err){showToast(err.message,'error')}finally{btn.innerHTML='Update Password';btn.disabled=false}}
</script>{% endblock %}
