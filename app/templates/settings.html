{% extends "base.html" %}
{% block title %}Settings — {{ congress_short }}{% endblock %}
{% block head %}<style>
.page-wrap{min-height:100vh}
.page-header{display:flex;align-items:center;gap:14px;margin:28px 0 24px}
.back-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--gb2);display:flex;align-items:center;justify-content:center;color:var(--w5);text-decoration:none;font-size:1rem;background:var(--gb);transition:.2s}
.back-btn:hover{background:var(--gb2);color:var(--gold);border-color:var(--gold)}
.settings-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--gb2);border-radius:var(--rx);overflow:hidden;margin-bottom:20px;max-width:560px}
.settings-header{background:linear-gradient(135deg,rgba(201,169,98,.1),rgba(201,169,98,.03));padding:20px 32px;border-bottom:1px solid var(--gb2);display:flex;align-items:center;gap:10px}
.settings-header h3{font:600 1rem var(--fh);color:var(--gold)}
.settings-body{padding:28px 32px}
.form-actions{display:flex;justify-content:flex-end;margin-top:8px;padding-top:16px;border-top:1px solid var(--gb2)}
@media(max-width:540px){.settings-header{padding:16px 20px}.settings-body{padding:20px}}
</style>{% endblock %}
{% block body %}
<div class="page-wrap">{% include "nav.html" %}<div class="container">
  <div class="page-header animate-up"><a href="/home" class="back-btn">←</a><h2>Settings</h2></div>
  <div class="settings-card animate-up delay-1">
    <div class="settings-header"><span style="font-size:1.1rem">🔒</span><h3>Change Password</h3></div>
    <div class="settings-body">
      <form onsubmit="handlePwChange(event)" style="display:flex;flex-direction:column;gap:16px">
        <div class="form-group"><label class="form-label">Current Password</label><input type="password" class="form-input" id="curPw" required></div>
        <div class="form-group"><label class="form-label">New Password</label><input type="password" class="form-input" id="newPw" required></div>
        <div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" class="form-input" id="confPw" required></div>
        <div class="form-actions"><button type="submit" class="btn btn-gold btn-sm" id="pwBtn">Update Password</button></div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
{% block scripts %}<script>async function handlePwChange(e){e.preventDefault();if(document.getElementById('newPw').value!==document.getElementById('confPw').value){showToast('Passwords do not match','error');return}const btn=document.getElementById('pwBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';try{const res=await fetch('/api/auth/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:document.getElementById('curPw').value,new_password:document.getElementById('newPw').value}),credentials:'same-origin'});const d=await res.json();if(!res.ok)throw new Error(d.detail);showToast('Password updated!','success');e.target.reset()}catch(err){showToast(err.message,'error')}finally{btn.innerHTML='Update Password';btn.disabled=false}}</script>{% endblock %}
