services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: congress_user
      POSTGRES_PASSWORD: congress_pass
      POSTGRES_DB: dubai_congress
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only — the app reaches Postgres over the compose
      # network, so this host mapping is for local tools (via SSH tunnel), not
      # the internet. (Docker's iptables rules bypass ufw, so a 0.0.0.0 bind
      # would expose the DB directly.)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U congress_user -d dubai_congress"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Localhost only — Redis has no auth; the app reaches it over the compose
      # network. Never publish this on 0.0.0.0.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      # Host port 80 → container's uvicorn on 8000. Keeps uvicorn on an
      # unprivileged port (the container runs as non-root) while serving
      # publicly on the standard HTTP port, so URLs need no ":8000".
      - "80:8000"
    environment:
      # production makes the app refuse to boot without a strong SECRET_KEY.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://congress_user:congress_pass@db:5432/dubai_congress
      # No insecure fallback: set SECRET_KEY in .env
      # (`python -c "import secrets; print(secrets.token_hex(32))"`).
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      CONGRESS_NAME: ${CONGRESS_NAME:-Dubai Stem Cell Congress}
      CONGRESS_YEAR: ${CONGRESS_YEAR:-2027}
      CONGRESS_DATES: ${CONGRESS_DATES:-Feb 15 – 17, 2027}
      CONGRESS_VENUE: ${CONGRESS_VENUE:-Dubai World Trade Centre}
      CONGRESS_DEADLINE: ${CONGRESS_DEADLINE:-December 1, 2026}
      # Web Push (VAPID). Leave blank to auto-generate + persist on first boot;
      # set explicitly to reuse keys across environments.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@dubaicongress.example}
      # Realtime fan-out for live Q&A (and future polls/reactions).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Social login (optional — buttons appear only when a provider is set).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_ENV: ${ORCID_ENV:-sandbox}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}
      # Uploaded manuscripts (PDF/Word). Default resolves under /app/data, the
      # persisted volume below, so files survive restarts.
      UPLOAD_DIR: ${UPLOAD_DIR:-data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      # Poster-gallery scavenger hunt: posters to visit to complete the hunt.
      POSTER_HUNT_GOAL: ${POSTER_HUNT_GOAL:-5}
      POSTER_APPROVAL_REQUIRED: ${POSTER_APPROVAL_REQUIRED:-false}
      MUTE_HOURS: ${MUTE_HOURS:-24}
      # Certificates: sessions for the attendance cert, credits for CME.
      CERT_MIN_SESSIONS: ${CERT_MIN_SESSIONS:-3}
      CERT_ATTENDANCE_PCT: ${CERT_ATTENDANCE_PCT:-0}
      CME_MIN_CREDITS: ${CME_MIN_CREDITS:-5}
      CME_CREDITS_PER_SESSION: ${CME_CREDITS_PER_SESSION:-1}
    volumes:
      # Persists auto-generated VAPID keys and uploaded manuscripts so they're
      # stable across restarts (otherwise browser subscriptions / files break).
      - vapid_keys:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # DB admin UI — disabled by default (profile "tools"). Enable only when
  # needed: `docker compose --profile tools up pgadmin`. Bound to localhost and
  # its credentials come from .env; never expose this publicly.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@congress.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  vapid_keys:
